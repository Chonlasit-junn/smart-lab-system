name: Sync backend to Hugging Face

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v6

      - name: Sync backend to Hugging Face Space
        uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: h0sh1na/smart-lab-backend
          repo_type: space
          space_sdk: docker
          subdirectory: backend
          hf_token: ${{ secrets.HF_TOKEN }}
