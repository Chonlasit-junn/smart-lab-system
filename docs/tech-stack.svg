<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
  <title id="title">Smart Lab Tech Stack</title>
  <desc id="description">แผนภาพ Frontend, Backend, Gatekeeper, Agent, Supabase, การ deploy และการทดสอบ</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#101c30"/>
    </linearGradient>
    <linearGradient id="apiGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#163b48"/>
      <stop offset="1" stop-color="#18263a"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020817" flood-opacity=".42"/>
    </filter>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#53d8d0"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#a78bfa"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#f6bd60"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#75d6a2"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", "Noto Sans Thai", Tahoma, sans-serif; }
      .muted { fill: #9eacc2; }
      .white { fill: #f5f8ff; }
      .smallcaps { font-size: 16px; font-weight: 700; letter-spacing: 2.5px; }
      .card { fill: #111d30; stroke: #2a3a52; stroke-width: 2; }
      .chip { fill: #1d2b40; stroke: #30435d; stroke-width: 1; }
      .chipText { fill: #dce6f5; font-size: 17px; font-weight: 600; }
      .body { fill: #c1cede; font-size: 20px; }
      .title { fill: #f5f8ff; font-size: 29px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#background)"/>
  <circle cx="1645" cy="30" r="310" fill="#126b72" opacity=".09"/>
  <circle cx="60" cy="860" r="280" fill="#6951b9" opacity=".08"/>
  <path d="M0 180H1920" stroke="#26364c" stroke-width="1"/>

  <text x="72" y="66" fill="#65e1d3" class="smallcaps">SMART LAB · MANAGEMENT PLATFORM</text>
  <text x="72" y="124" class="white" font-size="48" font-weight="800">TECH STACK</text>
  <text x="365" y="121" class="muted" font-size="23">เทคโนโลยีและเส้นทางเชื่อมต่อของระบบ</text>
  <rect x="1510" y="74" width="338" height="42" rx="21" fill="#14263a" stroke="#2f5263"/>
  <circle cx="1537" cy="95" r="6" fill="#65e1d3"/>
  <text x="1554" y="101" fill="#c6d8e8" font-size="15" font-weight="700" letter-spacing="1.4">SOURCE-BASED OVERVIEW</text>

  <!-- Connections sit behind the system cards. -->
  <path d="M548 320 C610 320 642 405 700 426" fill="none" stroke="#53d8d0" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowCyan)" opacity=".9"/>
  <path d="M548 566 C616 566 642 520 700 508" fill="none" stroke="#a78bfa" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowViolet)" opacity=".9"/>
  <path d="M548 787 C617 787 650 645 700 618" fill="none" stroke="#f6bd60" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowAmber)" opacity=".9"/>
  <path d="M1190 420 C1260 420 1295 369 1360 369" fill="none" stroke="#53d8d0" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowCyan)" opacity=".9"/>
  <path d="M1190 575 C1260 575 1298 624 1360 624" fill="none" stroke="#75d6a2" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowGreen)" opacity=".9"/>

  <!-- Frontend -->
  <g filter="url(#softShadow)">
    <rect x="72" y="210" width="476" height="220" rx="24" class="card"/>
    <rect x="72" y="210" width="7" height="220" rx="3.5" fill="#53d8d0"/>
    <circle cx="119" cy="256" r="22" fill="#173d43"/>
    <text x="119" y="262" text-anchor="middle" fill="#83eee2" font-size="14" font-weight="800">WEB</text>
    <text x="156" y="255" fill="#73e2d6" class="smallcaps">USER INTERFACE</text>
    <text x="105" y="306" class="title">Frontend</text>
    <rect x="105" y="328" width="198" height="34" rx="17" class="chip"/>
    <text x="204" y="351" text-anchor="middle" class="chipText">React 19 · Vite 8</text>
    <rect x="312" y="328" width="198" height="34" rx="17" class="chip"/>
    <text x="411" y="351" text-anchor="middle" class="chipText">MUI 7 · Emotion</text>
    <text x="105" y="393" class="body">Router · Axios · Day.js · Webcam</text>
    <text x="105" y="416" fill="#78dcd2" font-size="15" font-weight="700">SPA  →  VERCEL</text>
  </g>

  <!-- Gatekeeper -->
  <g filter="url(#softShadow)">
    <rect x="72" y="458" width="476" height="220" rx="24" class="card"/>
    <rect x="72" y="458" width="7" height="220" rx="3.5" fill="#a78bfa"/>
    <circle cx="119" cy="504" r="22" fill="#302956"/>
    <text x="119" y="510" text-anchor="middle" fill="#d0c1ff" font-size="14" font-weight="800">AI</text>
    <text x="156" y="503" fill="#b8a5ff" class="smallcaps">WINDOWS DESKTOP</text>
    <text x="105" y="554" class="title">AI Gatekeeper</text>
    <text x="105" y="590" class="body">CustomTkinter · OpenCV DNN</text>
    <text x="105" y="621" class="body">ONNX Runtime CPU · FP32</text>
    <text x="105" y="652" class="body">MiniFASNetV2 · RetinaFace</text>
  </g>

  <!-- Agent -->
  <g filter="url(#softShadow)">
    <rect x="72" y="706" width="476" height="158" rx="24" class="card"/>
    <rect x="72" y="706" width="7" height="158" rx="3.5" fill="#f6bd60"/>
    <circle cx="119" cy="752" r="22" fill="#493a25"/>
    <text x="119" y="758" text-anchor="middle" fill="#ffdb9a" font-size="14" font-weight="800">AG</text>
    <text x="156" y="751" fill="#f6c873" class="smallcaps">WINDOWS DESKTOP</text>
    <text x="105" y="800" class="title">Smart Lab Agent</text>
    <text x="105" y="836" class="body">PyQt6 · psutil · PyGetWindow · requests</text>
    <text x="105" y="856" fill="#e6c78e" font-size="15">SQLite outbox · Windows UI Automation</text>
  </g>

  <!-- Backend -->
  <g filter="url(#softShadow)">
    <rect x="700" y="326" width="490" height="358" rx="28" fill="url(#apiGlow)" stroke="#36717a" stroke-width="2.5"/>
    <rect x="700" y="326" width="490" height="7" rx="3.5" fill="#53d8d0"/>
    <circle cx="749" cy="376" r="23" fill="#17454a"/>
    <text x="749" y="382" text-anchor="middle" fill="#8ef0e4" font-size="14" font-weight="800">API</text>
    <text x="789" y="374" fill="#77e4d7" class="smallcaps">APPLICATION LAYER</text>
    <text x="735" y="429" class="white" font-size="35" font-weight="800">Backend</text>
    <text x="735" y="470" fill="#edf7fb" font-size="23" font-weight="650">Python 3.11 · FastAPI</text>
    <text x="735" y="505" class="body">Uvicorn · SQLAlchemy · Pydantic</text>
    <text x="735" y="540" class="body">DeepFace · Facenet · TensorFlow</text>
    <path d="M735 563H1155" stroke="#365466" stroke-width="1.5"/>
    <text x="735" y="596" fill="#9bc9ce" font-size="16" font-weight="700" letter-spacing="1.2">REST API</text>
    <text x="735" y="628" class="body">Auth · Booking · Policy</text>
    <text x="735" y="658" class="body">Face match · Agent telemetry</text>
  </g>

  <!-- Database -->
  <g filter="url(#softShadow)">
    <rect x="1360" y="245" width="488" height="240" rx="24" class="card"/>
    <rect x="1360" y="245" width="7" height="240" rx="3.5" fill="#53d8d0"/>
    <circle cx="1408" cy="292" r="22" fill="#173d43"/>
    <text x="1408" y="298" text-anchor="middle" fill="#83eee2" font-size="13" font-weight="800">DB</text>
    <text x="1446" y="291" fill="#73e2d6" class="smallcaps">PRIMARY DATA</text>
    <text x="1394" y="344" class="title">Supabase PostgreSQL</text>
    <text x="1394" y="383" class="body">SQLAlchemy · psycopg2</text>
    <text x="1394" y="415" class="body">Numbered SQL migrations</text>
    <text x="1394" y="455" fill="#78dcd2" font-size="15" font-weight="700">USERS · LABS · BOOKINGS · POLICY</text>
  </g>

  <!-- Object storage -->
  <g filter="url(#softShadow)">
    <rect x="1360" y="540" width="488" height="215" rx="24" class="card"/>
    <rect x="1360" y="540" width="7" height="215" rx="3.5" fill="#75d6a2"/>
    <circle cx="1408" cy="587" r="22" fill="#1c4038"/>
    <text x="1408" y="593" text-anchor="middle" fill="#a7f0c2" font-size="13" font-weight="800">IMG</text>
    <text x="1446" y="586" fill="#8de2ae" class="smallcaps">PROFILE STORAGE</text>
    <text x="1394" y="638" class="title">Supabase Storage</text>
    <text x="1394" y="676" class="body">Private bucket · signed URLs · HTTPX</text>
    <text x="1394" y="716" fill="#9dddb6" font-size="15" font-weight="700">LOCAL FILESYSTEM FALLBACK IN DEVELOPMENT</text>
  </g>

  <!-- Delivery strip -->
  <text x="72" y="906" fill="#9eacc2" class="smallcaps">DELIVERY · BUILD · QUALITY</text>
  <g>
    <rect x="72" y="925" width="565" height="112" rx="20" fill="#111d30" stroke="#2a3a52" stroke-width="1.5"/>
    <text x="101" y="962" fill="#73e2d6" font-size="15" font-weight="750" letter-spacing="1.5">DEPLOY</text>
    <text x="101" y="997" class="white" font-size="19" font-weight="650">Vercel · Hugging Face Spaces · Docker</text>
    <text x="101" y="1023" class="muted" font-size="15">GitHub Actions syncs Backend</text>
  </g>
  <g>
    <rect x="678" y="925" width="565" height="112" rx="20" fill="#111d30" stroke="#2a3a52" stroke-width="1.5"/>
    <text x="707" y="962" fill="#f6c873" font-size="15" font-weight="750" letter-spacing="1.5">WINDOWS PACKAGING</text>
    <text x="707" y="997" class="white" font-size="19" font-weight="650">PyInstaller · Visual Studio Installer</text>
    <text x="707" y="1023" class="muted" font-size="15">Agent distributed as MSI</text>
  </g>
  <g>
    <rect x="1284" y="925" width="564" height="112" rx="20" fill="#111d30" stroke="#2a3a52" stroke-width="1.5"/>
    <text x="1313" y="962" fill="#b8a5ff" font-size="15" font-weight="750" letter-spacing="1.5">TESTING</text>
    <text x="1313" y="997" class="white" font-size="19" font-weight="650">Python unittest · Node node:test</text>
    <text x="1313" y="1023" class="muted" font-size="15">Optional Playwright regression scripts</text>
  </g>
</svg>
