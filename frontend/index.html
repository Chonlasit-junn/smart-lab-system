    <script>
      // Paint the saved appearance before the application bundle is available.
      (() => {
        let theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        let language = 'th';
        try {
          const saved = localStorage.getItem('smart-lab-theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
          if (localStorage.getItem('smart-lab-language') === 'en') language = 'en';
        } catch { /* The loading frame also works without browser storage. */ }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.documentElement.lang = language;
        const path = location.pathname.replace(/\/$/, '');
        document.documentElement.dataset.startupLayout = ['', '/register', '/forgot-password'].includes(path) ? 'auth' : 'app';
        const startupViews = {
          '/booking': 'booking', '/reserved': 'table', '/history': 'table', '/my-tickets': 'table',
          '/profile': 'profile', '/admin': 'dashboard', '/admin/points': 'points',
          '/admin/points/policy': 'form', '/admin/roles': 'roles', '/manage-labs': 'labs',
          '/admin/devices': 'table', '/admin/reports': 'reports', '/verify-users': 'cards',
          '/blacklist': 'table', '/ticket': 'table',
        };
        document.documentElement.dataset.startupView = startupViews[path] || 'auth';
      })();
    </script>
